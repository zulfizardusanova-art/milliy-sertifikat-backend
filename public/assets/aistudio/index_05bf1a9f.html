async function pdfText(f){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let out='';
  for(let p=1;p<=pdf.numPages;p++){const c=await(await pdf.getPage(p)).getTextContent();let y=null,ln='';
    c.items.forEach(it=>{const yy=Math.round(it.transform[5]);if(y!==null&&Math.abs(yy-y)>3){out+=ln.trim()+'\n';ln=''}y=yy;ln+=it.str+' '});out+=ln.trim()+'\n'}
  return out}
function parseQ(txt){
  txt=txt.replace(/[ \t]+/g,' ');const st=[];let pos=0;
  for(let k=1;k<=45;k++){const m=new RegExp('(?:^|\\n)\\s*'+k+'\\s*[.)]\\s+','g');m.lastIndex=pos;const r=m.exec(txt);if(r){st.push([k,r.index,r.index+r[0].length]);pos=r.index+r[0].length}}
  const res={};st.forEach(([k,a,b],i)=>{res[k]=txt.slice(b,i+1<st.length?st[i+1][1]:txt.length).replace(/\s*\n\s*/g,' ').trim()});return res}
function splitOpt(b){
  const re=/(?:^|\s)([A-D])[.)]\s*/g,ix=[];let m,w=0;
  while(m=re.exec(b)){if(m[1]==='ABCD'[w]){ix.push({i:m.index,e:m.index+m[0].length});w++;if(w===4)break}}
  if(ix.length<4)return null;
  return{s:b.slice(0,ix[0].i).trim(),o:ix.map((x,j)=>b.slice(x.e,j<3?ix[j+1].i:b.length).trim())}}
function fillQ(res,key){
  let n=0,first='';const bad=[],put=(id,v)=>{Object.assign(gi(id),v);if(!first)first=id;n++};
  for(let k=1;k<=35;k++){const b=res[k];if(!b)continue;const o=splitOpt(b);
    if(o)put(''+k,{s:o.s,o:o.o,c:key[k]!==undefined?key[k]:-1,a:''});else{put(''+k,{s:b,o:['','','',''],c:-1,a:''});bad.push(k)}}
  for(let k=36;k<=45;k++){const b=res[k];if(!b)continue;const ms=[...b.matchAll(/(?:^|\s)([ab])\)\s*/g)];
    if(!ms.length){put(k+'a',{s:b,a:''});continue}
    const seg=i=>b.slice(ms[i].index+ms[i][0].length,i+1<ms.length?ms[i+1].index:b.length).trim(),intro=b.slice(0,ms[0].index).trim();
    ms.slice(0,2).forEach((m,i)=>put(k+m[1],{s:(i===0&&intro?intro+' ':'')+seg(i),a:''}))}
  return{n,bad,first}}
const KRE=()=>/(?:^|[\s,;(])(\d{1,2})\s*[-.:)]?\s*([A-Da-d])(?=[\s,;.]|$)/g;
function splitKey(txt){
  const ms=[...txt.matchAll(KRE())];let best=[];
  ms.forEach((m,i)=>{if(+m[1]!==1)return;const ch=[m];let w=2;for(let j=i+1;j<ms.length;j++)if(+ms[j][1]===w){ch.push(ms[j]);w++}if(ch.length>best.length)best=ch});
  if(best.length<5)return{body:txt,key:{}};
  const key={};best.forEach(m=>key[+m[1]]='ABCD'.indexOf(m[2].toUpperCase()));
  const cut=best[0].index;return{body:cut>txt.length*.3?txt.slice(0,cut):txt,key}}
function keyOnly(txt){const key={};[...txt.matchAll(KRE())].forEach(m=>{if(key[+m[1]]===undefined)key[+m[1]]='ABCD'.indexOf(m[2].toUpperCase())});return key}
window.importPdf=async()=>{
  const f=$('#pdff').files[0],f2=$('#pdfk2').files[0],ie=$('#ie');if(!f){ie.textContent='Avval PDF faylni tanlang.';return}
  if(SL.some(filled)&&!confirm('Kiritilgan savollar ustidan yoziladi. Davom etasizmi?'))return;
  const typed=keyOnly($('#pdfk').value);
  ie.textContent='O‘qilmoqda…';
  try{
    const sk=splitKey(await pdfText(f));let key={...sk.key,...typed};
    if(f2)key={...key,...keyOnly(await pdfText(f2))};
    const r=fillQ(parseQ(sk.body),key),nk=Object.keys(key).length;
    if(!r.n){ie.textContent='Savol topilmadi. PDF skanerlangan rasm bo‘lishi mumkin: bunday faylni o‘qib bo‘lmaydi.';return}
    draft.sel=r.first;render();
    $('#ie').textContent=`${r.n} ta savol o‘qildi, ${nk} ta javob kaliti topildi. Hammasini tekshirib chiqing.${r.bad.length?` Variantlari ajratilmagan savollar: ${r.bad.join(', ')}.`:''}`
  }catch(e){ie.textContent='PDF o‘qilmadi: '+(e.message||e)}};

window.editTest=async id=>{
  const t=S.tests.find(x=>x.id===id);if(!t)return;
  try{
    const c=(await getDoc(doc(fs,'keys',id))).data().c,d=NEW();
    Object.assign(d,{eid:id,tt:t.title,ta:lt(t.at),te:t.end?lt(t.end):'',td:t.dur,oly:!!t.oly});
    t.q.forEach((q,i)=>{d.it[q.n]=q.k==='w'?{s:q.s,o:['','','',''],c:-1,a:String(c[i])}:{s:q.s,o:q.o,c:c[i],a:''}});
    await Promise.all([...new Set(t.q.map(q=>q.im).filter(Boolean))].map(async k=>{d.im[k]=(await getDoc(doc(fs,'images',id+'_'+k))).data().d}));
    draft=d;tab='tests';flash='';render();scrollTo(0,0)

window.addTest=async()=>{
  const q=[],c=[],imgs={},bad=[],e=$('#er');
  SL.forEach(x=>{
    if(!filled(x))return;const v=draft.it[x.id],k=ik(x),im=draft.im[k]?k:'';
    if(x.k==='mc'){if(!(v.s.trim()||im)||v.o.some(o=>!o.trim())||v.c<0){bad.push(x.id);return}q.push({n:x.id,k:'mc',s:v.s.trim(),o:v.o.map(o=>o.trim()),im});c.push(v.c)}
    else{if(!v.s.trim()||!v.a.trim()){bad.push(x.id);return}q.push({n:x.id,k:'w',s:v.s.trim(),im});c.push(v.a.trim())}
    if(im)imgs[k]=draft.im[k]});
  const at=new Date(draft.ta).getTime(),end=draft.te?new Date(draft.te).getTime():0,dur=Math.round(+draft.td);
  const err=!draft.tt.trim()?'Test nomini yozing.':isNaN(at)?'Boshlanish vaqtini tanlang.':end&&end<=at?'Tugash vaqti boshlanishdan keyin bo‘lishi kerak.':!(dur>0)?'Ishlash vaqtini kiriting.':bad.length?`To‘liq emas: ${bad.join(', ')}. Test savolida matn, to‘rtta javob va to‘g‘ri javob belgisi, yozma savolda matn va to‘g‘ri javob bo‘lishi kerak.`:q.length?'':'Kamida bitta savol kiriting.';
  if(err){e.textContent=err;return}
  const id=draft.eid||doc(collection(fs,'tests')).id,b=writeBatch(fs),old=draft.eid?S.tests.find(t=>t.id===id):null;
  b.set(doc(fs,'tests',id),{title:draft.tt.trim(),at:Timestamp.fromMillis(at),...(end?{end:Timestamp.fromMillis(end)}:{}),dur,q,oly:!!draft.oly&&me().role==='owner',by:uid});
  b.set(doc(fs,'keys',id),{c});
  Object.entries(imgs).forEach(([k,d])=>b.set(doc(fs,'images',id+'_'+k),{d}));
  if(old)old.q.map(x=>x.im).filter(k=>k&&!imgs[k]).forEach(k=>b.delete(doc(fs,'images',id+'_'+k)));
  try{await b.commit()}catch(x){e.textContent='Saqlanmadi: '+x.code;return}
  flash=draft.eid?'Test yangilandi.':'Test saqlandi.';draft=NEW();render()};
window.delTest=async id=>{
  if(!confirm('Test o‘chiriladi. Foydalanuvchilarning natijalari reytingda saqlanib qoladi. Davom etasizmi?'))return;
